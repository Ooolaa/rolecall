# Runs the template's backend tests against a throwaway Postgres.
# WORK is the scorer's copy of the tree; TESTS is the pytest paths to run (relative to backend/).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      retries: 30
  tests:
    image: ghcr.io/astral-sh/uv:0.9.26-python3.14-bookworm-slim
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WORK:?}:/work
    working_dir: /work/backend
    environment:
      DATABASE_URL: postgresql://postgres:changethis@db:5432/app
      UV_LINK_MODE: copy
      # The container runs as root: on Linux, directories it creates in /work are root-owned and the
      # scorer can't delete them. Keep the venv and bytecode out of /work.
      UV_PROJECT_ENVIRONMENT: /venv
      PYTHONDONTWRITEBYTECODE: "1"
      TESTS: ${TESTS:?}
    command:
      - bash
      - -c
      # app/frontend is the built SPA (git-ignored); the API tests only need the directory to exist.
      - mkdir -p app/frontend && uv sync --quiet && uv run bash scripts/prestart.sh && uv run pytest -p no:cacheprovider -q --junitxml=/work/junit.xml $$TESTS
